- gz_topic_name: "/model/wam-v/joint/right_engine_joint/cmd_pos"
  ros_topic_name: "/wamv/thrusters/right/pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
