  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# GPS - Using the exact topic from your SDF
- gz_topic_name: "wamv/sensors/gps/gps/fix"
